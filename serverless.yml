service: aws-node-ts-service

frameworkVersion: "3"

package:
  individually: true
  patterns:
    - "!node_modules/**"

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  stage: ${opt:stage, 'development'}
  region: ${file(./config/config.js):aws.region}
  deploymentMethod: direct
  memorySize: 256
  timeout: 30
  versionFunctions: false
  # Cost control: short log retention by default. Adjust per stage in config/{stage}.json
  logRetentionInDays: ${file(./config/config.js):aws.logRetentionInDays}
  endpointType: REGIONAL
  stackTags:
    Service: ${self:service}
    Environment: ${self:provider.stage}
  environment:
    NODE_ENV: ${self:provider.stage}
    SERVICE_NAME: ${self:service}
    LOG_LEVEL: ${file(./config/config.js):logLevel, 'info'}

functions:
  - ${file(./src/infrastructure/aws/lambda/create-item/function.yml)}
  - ${file(./src/infrastructure/aws/lambda/get-item/function.yml)}
  - ${file(./src/infrastructure/aws/lambda/remove-item-stock/function.yml)}

resources:
  Resources: ${file(./resources.yml)}

custom:
  serverless-offline:
    noPrependStageInUrl: true
    host: 127.0.0.1
    httpPort: 4040

  esbuild:
    bundle: true
    platform: "node"
    exclude:
      - "@aws-sdk/*"
    minify: ${file(./config/config.js):esbuild.minify, true}
    sourcemap: ${file(./config/config.js):esbuild.sourcemap, false}

  # ─────────────────────────────────────────────────────────────────────
  # CloudWatch alarms are DISABLED by default to keep costs low
  # (each alarm costs ~USD 0.10/month). To enable them for a stage:
  #   1. uncomment `serverless-plugin-aws-alerts` in `plugins`
  #   2. uncomment the `alerts` block below and list the target stages
  #   3. optionally point `alarmActions` to an SNS topic ARN/SSM param
  # ─────────────────────────────────────────────────────────────────────
  # alerts:
  #   stages:
  #     - production
  #   dashboards: false
  #   nameTemplate: $[functionName]-$[metricName]-alarm
  #   definitions:
  #     functionErrors:
  #       period: 60
  #       evaluationPeriods: 3
  #       datapointsToAlarm: 2
  #       treatMissingData: notBreaching
  #     functionThrottles:
  #       treatMissingData: notBreaching
  #   alarms:
  #     - functionErrors
  #     - functionThrottles

plugins:
  - serverless-esbuild
  - serverless-offline
  # - serverless-plugin-aws-alerts
